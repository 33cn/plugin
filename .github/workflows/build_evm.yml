name: ci_evm
on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  ci_evm:
    name: ci_evm
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
      - name: deploy
        run: |
          make docker-compose dapp=evm
          make docker-compose-down dapp=evm