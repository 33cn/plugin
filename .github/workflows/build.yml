name: ci_base
on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  check_fmt:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Intsall Golangci-lint
        run: |
          # add executables installed with go get to PATH
          # TODO: this will hopefully be fixed by
          # https://github.com/actions/setup-go/issues/14
          export PATH=${PATH}:`go env GOPATH`/bin
          echo $GOPATH
          echo $PATH
          go install golang.org/x/tools/cmd/goimports@v0.24.0
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.53.3
          go install mvdan.cc/sh/v3/cmd/shfmt@v3.7.0
          go install mvdan.cc/sh/v3/cmd/gosh@v3.7.0

      - name: Lint
        run: |
          make largefile-check
          make checkgofmt
          make linter
          make

  # 全量 go test -race 单 job 约 13 分钟，拆成 4 个并行分片执行；
  # 聚合 job 仍命名为 unit-test，保持分支保护里 Required check 的名称不变。
  unit-test:
    name: unit-test
    needs: unit-test-shard
    if: always()
    runs-on: ubuntu-22.04
    steps:
      - name: check shards
        run: |
          echo "shards result: ${{ needs.unit-test-shard.result }}"
          if [ "${{ needs.unit-test-shard.result }}" != "success" ]; then
            echo "::error::unit-test 分片未全部通过"
            exit 1
          fi

  unit-test-shard:
    name: unit-test shard
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: Set up Golang
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
        id: go
      - name: set go env
        run: export PATH=${PATH}:`go env GOPATH`/bin
      - name: unit-test
        run: |
          # 按包序号取模分片，不维护硬编码包列表，新增包会自动落到某个分片
          PKGS=$(go list ./... | grep -v pbft | awk -v s=${{ matrix.shard }} 'NR % 4 == s % 4')
          echo "shard ${{ matrix.shard }}: $(echo "$PKGS" | wc -l) packages"
          go test -parallel=8 -race $PKGS

  coverage:
    name: coverage
    runs-on: ubuntu-22.04
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: Set up Golang
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
        id: go
      - name: set go env
        run: export PATH=${PATH}:`go env GOPATH`/bin

      - name: ut coverage
        run: make coverage
      - name: cover report
        if: success()
        run: bash <(curl -s https://codecov.io/bash)

  autotest:
    name: autotest
    runs-on: ubuntu-22.04
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: Set up Golang
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
        id: go
      - name: set go env
        run: export PATH=${PATH}:`go env GOPATH`/bin
      - name: deploy
        run: |
          make build_ci
          make autotest dapp=all

  ci_base:
    name: ci_base
    runs-on: ubuntu-22.04
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: Set up Golang
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
        id: go
      - name: set go env
        run: export PATH=${PATH}:`go env GOPATH`/bin
      - name: deploy
        run: |
          make docker-compose
          make docker-compose-down

  test-arch-386:
    name: Test GOARCH 386
    runs-on: ubuntu-22.04
    env:
      GOARCH: 386
      CGO_ENABLED: 1

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
      - run: |
            sudo apt-get update
            sudo apt-get install --fix-missing gcc-multilib

      - name: Build
        # 只需要验证 386 下能编译: build_only 跳过 depends 里几十个 dapp cmd 产物的编译(约省 70s)
        run: make build_only

      - name: Run unit tests
        run: go test ./... -covermode=atomic
