name: ci_ticket
on: [push, pull_request]

# ticket 模块集成测试（plugin/dapp/ticket/cmd/build/testcase.sh）。
# 主链 [consensus] 本身就是 ticket 共识（chain33.toml name="ticket"），
# 测试覆盖 ticket 生命周期：自动挖矿开关、买票绑定、票查询、解绑。
# 替代原 Jenkins/GitLab 时代的 autotest_tick（chain33 build/autotest/gitlabci
# 双节点脚本，其"关闭自动挖矿后等出块"的逻辑与当前链行为不匹配且无维护）。

jobs:
  ci_ticket:
    name: ci_ticket
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: checkout
        uses: actions/checkout@v3

      - name: Set up Golang
        uses: actions/setup-go@v3
        with:
          go-version-file: 'go.mod'
        id: go

      - name: set go env
        run: export PATH=${PATH}:`go env GOPATH`/bin

      - name: deploy
        run: make docker-compose dapp=ticket

      - name: cleanup
        if: always()
        run: make docker-compose-down dapp=ticket
