name: ci_relay
on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  ci_relay:
    name: ci_relay
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Golang
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
        id: go
      - name: set go env
        run: export PATH=${PATH}:`go env GOPATH`/bin

      - name: deploy
        run: |
          make docker-compose dapp=relay
          make docker-compose-down dapp=relay
