name: build_windows
on: [push, pull_request]

jobs:
  build-windows:
    name: build on windows
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Set up Golang
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
        id: go

      - name: go env
        run: |
          go version
          go env

      - name: build
        shell: cmd
        run: build.bat

      - name: Upload artifact bin
        uses: actions/upload-artifact@v4
        with:
          name: chain33-windows-amd64
          path: |
            chain33.exe
            chain33-cli.exe
