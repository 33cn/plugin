syntax = "proto3";

package types;
option go_package = "../types";

message RgbxAction {
  int32 ty = 1;
  oneof value {
    mintAsset mint = 2;
    transferAsset transfer = 3;
    confirmTx confirm = 4;
  }
}

message asset {

  uint32 type = 1;
  int64 totalAmount = 2;
  string symbol = 3;
  bytes metaHash = 4;
  string genesisTxHash = 5;
}


message mintAsset {
  uint32 type = 1;
  int64 totalAmount = 2;
  string symbol = 3;
  bytes metaHash =4;
  // represents the outpoint of the transaction's
  // input that resulted in the creation of the asset.
  outPoint genesisOut = 5;
}

message outPoint {
  bytes hash = 1;
  uint32 index = 2;
  bytes pkScript = 3;
}

message txOut {
  int64 value = 1;
  bytes pkScript =2;
}

message utxoSpendingProof {
  uint32 spendingInputIdx = 1;
  int32 opRetOutputIdx =2;
  bytes spendingTx = 3;
  bytes opRetOutputPkScript = 4;
}

message AssetAccount {

  oneof value {
    outPoint utxo =1;
    string address = 2;
  }
}

message transferAsset {

  string symbol = 1;
  int64 amount = 2;
  AssetAccount from = 3;
  AssetAccount to = 4;
  AssetAccount change = 5;
}

message confirmTx {

  int32 actionType = 1;
  int64 confirmedBlockHeight = 2;
  int64 txBlockHeight = 3;
  int64 txIndex = 4;
  bytes txHash = 5;
  bool timeout = 6;
  utxoSpendingProof proof =7;
}


message pendingTx {
  int32 actionType = 1;
  int64 timestamp = 2;
  int64 txBlockHeight = 3;
  int64 txIndex = 4;
  bytes txHash = 5;
  outPoint utxo = 6;
  bool confirmed = 7;
}

message pendingTxs {
  repeated pendingTx pendingList=1;
}

message ReqListPendingTx {
  int64 startHeight = 1;
  int64 startIndex = 2;
  int32 count = 3;
}


message ReqGetPendingTx {
  int64 height = 1;
  int64 index = 2;
}

service rgbx {

}

